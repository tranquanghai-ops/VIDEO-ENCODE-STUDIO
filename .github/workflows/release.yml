name: Release Video Encode Studio

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-video-encode
  cancel-in-progress: false

jobs:
  release:
    name: Build, Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)
          test -d dist/assets || (echo "dist/assets missing!" && exit 1)
          test -d dist/ffmpeg || (echo "dist/ffmpeg missing!" && exit 1)
          echo "Build verification passed."

      - name: Package artifact
        run: |
          cd dist
          zip -r ../video-encode.zip .
          cd ..
          test -f video-encode.zip || (echo "video-encode.zip missing!" && exit 1)
          echo "Artifact video-encode.zip created successfully."

      - name: Determine Version Tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VER=$(node -p "require('./package.json').version")
          test "$TAG" = "v$PKG_VER" || (echo "Tag $TAG must match package version v$PKG_VER" && exit 1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Video Encode Studio ${{ steps.tag.outputs.tag }}"
          body: "Automated distribution artifact release for TDTU TKNT Portal integration."
          files: video-encode.zip
          draft: false
          prerelease: false
